<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガチャガチャアプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ログイン/新規登録 -->
<div id="authScreen" class="wrap">
  <div class="auth-box card">
    <div class="display" id="authTitle">ログイン</div>
    <p class="sub">ガチャを回してポイントを賭けよう</p>
    <div id="authMsg"></div>
    <div class="form-row">
      <label>ユーザー名</label>
      <input id="authUsername" type="text" autocomplete="username">
    </div>
    <div class="form-row">
      <label>パスワード</label>
      <input id="authPassword" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%" id="authSubmit">ログイン</button>
    <div class="switch-link" id="authSwitch">アカウントをお持ちでないですか？ <b>新規登録</b></div>
  </div>
</div>

<!-- メイン画面 -->
<div id="mainScreen" class="wrap hidden">
  <div class="topbar">
    <div class="brand">
      <div class="capsule-icon"></div>
      <span class="display">ガチャガチャ</span>
    </div>
    <div class="user-chip">
      <span><b id="meUsername"></b></span>
      <span class="pt">💰 <span id="mePoints">0</span> pt</span>
      <a href="/admin.html" id="adminLink" class="btn btn-ghost btn-sm hidden">管理画面</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">ログアウト</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="gachas">ガチャ一覧</div>
    <div class="tab" data-tab="shop">ショップ</div>
    <div class="tab" data-tab="myitems">アイテム</div>
    <div class="tab" data-tab="mytickets">マイチケット</div>
    <div class="tab" data-tab="history">履歴</div>
  </div>

  <div id="tabGachas">
    <div class="gacha-grid" id="gachaGrid"></div>
  </div>

  <div id="tabShop" class="hidden">
    <div id="shopList"></div>
  </div>

  <div id="tabMyItems" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">アイテム</h3>
      <p style="color:var(--text-dim); font-size:12px; margin-top:-6px;">ショップで手に入れた、手元に残るアイテムです。</p>
      <div id="myItemsList"></div>
    </div>
  </div>

  <div id="tabMyTickets" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">マイチケット</h3>
      <p style="color:var(--text-dim); font-size:12px; margin-top:-6px;">ショップやガチャで手に入れた、実際に使えるチケットです。使ったら「使用済みにする」を押してください。</p>
      <div id="myTicketsList"></div>
    </div>
  </div>

  <div id="tabHistory" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">これまでの結果</h3>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<!-- ガチャを回すモーダル -->
<div id="playScreen" class="wrap hidden">
  <button class="btn btn-ghost btn-sm" id="backBtn">← 戻る</button>
  <div class="card machine">
    <h2 class="display" id="playGachaName">-</h2>
    <div class="gacha-meta" id="playGachaMeta"></div>
    <div id="playMsg"></div>

    <div id="capsuleArea" style="min-height:150px; display:flex; align-items:center; justify-content:center;">
      <div class="knob" id="knob">まわす</div>
    </div>
    <div id="resultText" style="font-size:20px; font-weight:900; min-height:28px;"></div>

    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" id="playWithPoints">ポイントで引く</button>
      <button class="btn btn-secondary" id="playWithTicket">チケットで引く (<span id="ticketCount">0</span>)</button>
    </div>

    <details style="width:100%; margin-top:10px;">
      <summary style="cursor:pointer; color:var(--text-dim); font-size:13px;">排出確率を見る</summary>
      <table style="margin-top:10px;">
        <thead><tr><th>アイテム</th><th>確率</th></tr></thead>
        <tbody id="oddsTable"></tbody>
      </table>
    </details>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
